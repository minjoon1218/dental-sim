<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두근두근 치의학부 B반 · 술식 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gaegu:wght@700&display=swap">
<style>
:root{
  --bg:#E8F4FC;--surface:#FFFFFF;--surface-alt:#F1F8FE;--ink:#2E4354;--ink-muted:#5B788C;--line:#BEDCF2;
  --accent:#3289D4;--accent-soft:#D5EAFA;--accent-ink:#1D5C98;--warn:#B8552B;--sparkle:#9ED2F6;--radius:14px;--title-shadow:#fff;--ban:#FFE27A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15212c;--surface:#1d2c39;--surface-alt:#243848;--ink:#e6f1fa;--ink-muted:#a5c0d3;--line:#2f4a60;
    --accent:#6bb8f2;--accent-soft:#23415c;--accent-ink:#a9d9ff;--warn:#E08A5C;--sparkle:#86c6f3;--title-shadow:#243848;--ban:#2c5f8c;
  }
}
:root[data-theme="dark"]{
  --bg:#15212c;--surface:#1d2c39;--surface-alt:#243848;--ink:#e6f1fa;--ink-muted:#a5c0d3;--line:#2f4a60;
  --accent:#6bb8f2;--accent-soft:#23415c;--accent-ink:#a9d9ff;--warn:#E08A5C;--sparkle:#86c6f3;--title-shadow:#243848;--ban:#2c5f8c;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:20px 18px 40px}
#homePage{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* 브랜드 */
.brand-block{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:32px 28px 26px;text-align:center;overflow:hidden}
.brand-shape{position:absolute;pointer-events:none;z-index:0}
.brand-text{position:relative;z-index:1}
.brand-title{margin:0;font-family:'Gaegu',sans-serif;font-weight:700;font-size:clamp(36px,7vw,56px);line-height:1.1;color:var(--accent);text-shadow:3px 3px 0 var(--title-shadow)}
.brand-sub{margin-top:8px;font-family:'Gaegu',sans-serif;font-weight:700;font-size:clamp(18px,3.4vw,24px);color:var(--accent-ink)}
.brand-line{font-family:'Gaegu',sans-serif;font-weight:700;font-size:16px;color:var(--accent);margin-top:10px}
.mini-ban{background:linear-gradient(transparent 55%,var(--ban) 55%);padding:0 4px;color:var(--accent-ink)}
.brand-ban{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.ban-text{display:inline-block;font-size:1.45em;line-height:1;color:var(--accent-ink);padding:2px 22px 6px;border-radius:999px;
  background:linear-gradient(transparent 52%,var(--ban) 52%,var(--ban) 92%,transparent 92%);text-shadow:3px 3px 0 var(--title-shadow)}
.ban-star{font-size:.6em;color:var(--sparkle)}
ul.patch li.new::marker{content:"🆕 "}
.brand-mini{font-family:'Gaegu',sans-serif;font-weight:700;font-size:24px;color:var(--accent);text-align:center;padding:4px 0}
@keyframes brandPopIn{0%{opacity:0;transform:scale(.85) translateY(8px)}100%{opacity:1;transform:none}}
.brand-enter{animation:brandPopIn .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.75) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(18deg)}}
.tw{display:inline-block;animation:twinkle 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bob{animation:bob 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.tw,.bob,.brand-enter{animation:none}}

/* 공지·패치 카드 */
.intro-note{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;font-size:14px;color:var(--ink-muted);line-height:1.65}
.intro-note p{margin:0 0 8px}.intro-note p:last-child{margin-bottom:0}
.intro-note b{color:var(--ink);font-weight:600}
.intro-note.center{text-align:center}
.notice-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:15px;font-weight:700;color:var(--accent-ink);margin-bottom:10px}
.notice-meta{font-size:11.5px;font-weight:500;color:var(--ink-muted)}
summary.notice-head{cursor:pointer;list-style:none;margin-bottom:0}
summary.notice-head::-webkit-details-marker{display:none}
summary.notice-head::after{content:"▾";color:var(--ink-muted);font-weight:400}
details.intro-note:not([open]) summary.notice-head::after{content:"▸"}
details[open] summary.notice-head{margin-bottom:10px}
.chalkboard{background:#2f4a3d;border:10px solid #7a5230;box-shadow:inset 0 0 22px rgba(0,0,0,.35);color:#e8efe9}
.chalkboard .notice-head{color:#cfe9ff}
.chalkboard b{color:#ffe08a}
.chalk-cta{font-family:'Gaegu',sans-serif;font-weight:700;font-size:22px;color:#ffe08a;margin:14px 0 0!important;text-align:center}
ul.patch{margin:0;padding-left:18px;line-height:1.8}

/* 입장 카드 */
.action .field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-muted);margin-bottom:6px}
.action input{font:inherit;font-size:20px;letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface-alt);color:var(--ink);text-align:center}
.action input:focus{outline:none;border-color:var(--accent)}
.next-btn{display:block;margin:14px auto 6px;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:16px 44px;font-family:'Gaegu',sans-serif;font-weight:700;font-size:22px;cursor:pointer;box-shadow:0 4px 0 var(--accent-ink);transition:transform .08s}
.next-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-ink)}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.btn-soft{font:inherit;font-size:14px;font-weight:600;background:var(--surface-alt);color:var(--accent-ink);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer}
.btn-soft:hover{border-color:var(--accent)}
.btn-soft:disabled{opacity:.45;cursor:not-allowed}
.link-btn{display:block;margin:4px auto 0;background:none;border:none;color:var(--ink-muted);font:inherit;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);padding:2px 0}
.link-btn.small{display:inline;margin:0;font-size:12px;font-weight:500}
.msg{text-align:center;color:var(--ink-muted);min-height:1.2em;margin:8px 0 0}
.hint{font-size:12.5px;color:var(--ink-muted);background:var(--surface-alt);border-radius:10px;padding:8px 12px;margin:10px 0 0!important}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 기록·리더보드 */
.page-head{display:flex;justify-content:space-between;align-items:center}
.page-head h2{margin:0;font-family:'Gaegu',sans-serif;font-size:30px;color:var(--accent-ink)}
.sort-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sort-btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font:inherit;font-size:12.5px;color:var(--ink-muted);cursor:pointer}
.sort-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--surface-alt);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.stats b{font-size:22px;color:var(--accent)}
.stats span{font-size:12px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;color:var(--ink)}
.tbl th{text-align:left;color:var(--ink-muted);font-weight:600;padding:8px 6px;border-bottom:2px dashed var(--line);white-space:nowrap}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line)}
.tbl .rrow{cursor:pointer}.tbl .rrow:hover{background:var(--surface-alt)}
.tbl .rdet td{color:var(--ink-muted);font-size:13px;line-height:1.7;background:var(--surface-alt)}
.tbl tr.me td{background:var(--accent-soft);font-weight:600}
.tbl .rank{font-size:18px;width:52px}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent-ink)}
.pill.exam{background:var(--accent);color:#fff}
.star{color:var(--accent)}

/* 시뮬레이터 화면 */
.game-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.stagebox{position:relative;border-radius:16px;overflow:hidden;background:#0c1412;border:2px solid var(--line)}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.bar button{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.bar button.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 var(--accent-ink)}
.bar label{font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
#status{font-size:13px;color:var(--ink-muted);margin-left:auto}
.help{margin-top:12px;font-size:13px;color:var(--ink-muted);line-height:1.7}
video{display:none}
[hidden]{display:none!important}
.warnbox{background:#fff4d6;border-color:#f2c94c;color:#6b4e00}.warnbox b{color:#6b4e00}
.fs-tools{display:none;position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);gap:8px;z-index:3}
.fs-tools button{width:44px;height:44px;border-radius:50%;border:none;background:rgba(0,0,0,0.55);color:#fff;font-size:18px;cursor:pointer}
.stagebox:fullscreen .fs-tools,.stagebox.pseudo-fs .fs-tools{display:flex}
.stagebox:-webkit-full-screen .fs-tools{display:flex}
.stagebox.pseudo-fs{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#000;border:none;border-radius:0;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.stagebox.pseudo-fs canvas{width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9));height:auto}
body.noscroll{overflow:hidden;position:fixed;width:100%}
.rotate-hint{display:none;margin:0 0 8px;font-size:13px;color:var(--accent-ink);background:var(--accent-soft);border-radius:10px;padding:8px 12px;text-align:center}
@media (orientation:portrait) and (max-width:820px){.rotate-hint{display:block}}
.stagebox:fullscreen{display:flex;align-items:center;justify-content:center;background:#000;border:none;border-radius:0}
.stagebox:fullscreen canvas{width:auto;height:auto;max-width:100vw;max-height:100vh}
.stagebox:-webkit-full-screen{display:flex;align-items:center;justify-content:center;background:#000;width:100%;height:100%}
@media (max-width:640px){.app{padding:12px 10px 30px}.bar button{font-size:13px;padding:8px 11px}.bar label{font-size:12px}#status{margin-left:0;width:100%}.help{font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <section id="homePage"></section>
  <section id="gamePage" hidden>
    <div class="game-top">
      <div class="brand-mini"><span class="tw" style="animation-delay:.3s">✦</span> 두근두근 치의학부 <b class="mini-ban">B반</b> <span class="tw">✦</span></div>
      <button class="btn-soft themeBtn">🌙 다크 모드로 보기</button>
    </div>
    <p class="rotate-hint">📱 휴대폰을 가로로 돌리면 훨씬 크게 보여요. 터치로도 진행할 수 있어요.</p>
    <div class="stagebox"><canvas id="stage" aria-label="시뮬레이션 화면"></canvas><div class="fs-tools"><button id="fsCam" aria-label="카메라 켜기/끄기">📷</button><button id="fsExit" aria-label="전체 화면 끝내기">✕</button></div></div>
    <div class="bar">
      <button class="primary" id="camBtn">카메라 켜기</button>
      <button id="backBtn">← 뒤로</button>
      <button id="homeBtn">처음 화면</button>
      <button id="handBtn">주로 쓰는 손: 오른손</button>
      <button id="pipMinBtn">내 화면 접기</button>
      <button id="fsBtn">⛶ 전체 화면</button>
      <label>움직임 추적 감도 <input id="sens" type="range" min="10" max="60" value="28"></label>
      <label><input id="showCam" type="checkbox" checked> 내 화면 표시</label>
      <span id="status">마우스 모드</span>
    </div>
    <p class="help">⚠️ <b>카메라는 Chrome에서 열어야 인식돼요.</b> 카메라를 켜면 MediaPipe 손 추적이 켜져요(처음 몇 초 로딩). 손 전체가 화면에 들어오게, 카메라에서 50–70cm 떨어져 손바닥을 카메라 쪽으로 향하면 가장 안정적이에요. 마우스로도 진행할 수 있어요.</p>
    <video id="vid" playsinline muted></video>
  </section>
</div>
<script>
(function(){
/* ===== 설정: Supabase 프로젝트 URL과 anon(publishable) 키를 넣으면 서버 기록·리더보드가 켜집니다 ===== */
const SUPABASE_URL='https://khstilpjsvabimttzjww.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_Cl2pXHilGiENy_YMU3vaRQ_XyJ_crdt';  // publishable 키만. secret 키는 절대 넣지 마세요
const CLASS_NAME='두근두근 치의학부 B반';
const API_ON=!!(SUPABASE_URL&&SUPABASE_ANON_KEY);
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)}}
const W=1280,H=720,DW=750;
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const video=document.getElementById('vid');
const statusEl=document.getElementById('status');
const sensEl=document.getElementById('sens');
const showCamEl=document.getElementById('showCam');
const FONT='"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
const clamp01=v=>Math.max(0,Math.min(1,v));

/* ================= input ================= */
let camOn=false,prevGray=null,lastMouse=-9999,mouseDown=false,inputSrc='mouse';
let handMode=false,landmarker=null,handTried=false,pinch=false,handSeen=false,lastLm=null,lastVT=-1;
const aux={x:200,y:400,tx:200,ty:400,seen:false,pinch:false,lm:null};
let domHand=(()=>{try{return localStorage.getItem('dds_hand')||'R'}catch(e){return'R'}})();
const SW=96,SH=54;
const sm=document.createElement('canvas');sm.width=SW;sm.height=SH;
const smx=sm.getContext('2d',{willReadFrequently:true});
const cur={x:440,y:400,tx:440,ty:400,vx:0,vy:0};
function setStatus(t){statusEl.textContent=t}
async function startCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
    video.srcObject=s;await video.play();camOn=true;
    document.getElementById('camBtn').textContent='카메라 끄기';
    if(!handTried)initHands();else setStatus(handMode?'손 추적 ON':'움직임 추적 모드');
  }catch(e){setStatus((typeof IS_CHROME!=='undefined'&&IS_CHROME)?'카메라를 열 수 없음('+e.name+') · 카메라 권한을 확인하세요':'카메라를 열 수 없음 · Chrome으로 접속해야 카메라가 인식돼요')}
}
async function initHands(){
  handTried=true;setStatus('손 추적 모델 불러오는 중…');
  const base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const model='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
  try{
    const vision=await import(base+'/vision_bundle.mjs');
    const fs=await vision.FilesetResolver.forVisionTasks(base+'/wasm');
    const mk=d=>vision.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:'VIDEO',numHands:2,
      minHandDetectionConfidence:0.5,minTrackingConfidence:0.5});
    try{landmarker=await mk('GPU')}catch(e){landmarker=await mk('CPU')}
    handMode=true;setStatus('손 추적 ON · 엄지·검지 사이가 커서, 엄지-검지 집기 = 잡기');
  }catch(e){handMode=false;setStatus('손 추적 모델을 못 불러와 움직임 추적으로 대체합니다 ('+(e.message||e.name)+')')}
}
function stopCam(){const s=video.srcObject;if(s)s.getTracks().forEach(t=>t.stop());video.srcObject=null;camOn=false;prevGray=null;lastLm=null;
  if(pinch){pinch=false;onRelease('pinch')}
  document.getElementById('camBtn').textContent='카메라 켜기';setStatus('마우스 모드')}
document.getElementById('camBtn').onclick=()=>camOn?stopCam():startCam();
function camCrop(){const vw=video.videoWidth||640,vh=video.videoHeight||480,ch=vw*9/16;
  return ch<=vh?{sx:0,sy:(vh-ch)/2,sw:vw,sh:ch}:{sx:(vw-vh*16/9)/2,sy:0,sw:vh*16/9,sh:vh}}
function trackMotion(){
  const c=camCrop();
  smx.save();smx.translate(SW,0);smx.scale(-1,1);smx.drawImage(video,c.sx,c.sy,c.sw,c.sh,0,0,SW,SH);smx.restore();
  const d=smx.getImageData(0,0,SW,SH).data,n=SW*SH,g=new Uint8Array(n),th=+sensEl.value;
  let sx=0,sy=0,cnt=0;
  for(let i=0;i<n;i++){const v=(d[i*4]*0.3+d[i*4+1]*0.59+d[i*4+2]*0.11)|0;g[i]=v;
    if(prevGray&&Math.abs(v-prevGray[i])>th){sx+=i%SW;sy+=(i/SW)|0;cnt++}}
  prevGray=g;
  if(cnt>14&&performance.now()-lastMouse>900){cur.tx=(sx/cnt+0.5)/SW*W;cur.ty=(sy/cnt+0.5)/SH*H}
}
function lmNorm(p){const c=camCrop(),vw=video.videoWidth||640,vh=video.videoHeight||480;
  return{x:1-(p.x*vw-c.sx)/c.sw,y:(p.y*vh-c.sy)/c.sh}}
function handPt(lm){const a=lmNorm(lm[8]),b=lmNorm(lm[4]),gain=0.74,off=(1-gain)/2;return{x:clamp01(((a.x+b.x)/2-off)/gain)*W,y:clamp01(((a.y+b.y)/2-off)/gain)*H}}
function pinchDist(lm){const size=Math.hypot(lm[0].x-lm[9].x,lm[0].y-lm[9].y)||0.1;return Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y)/size}
function trackHands(){
  if(video.currentTime===lastVT)return;lastVT=video.currentTime;
  let r;try{r=landmarker.detectForVideo(video,performance.now())}catch(e){return}
  const lms=(r&&r.landmarks)||[];
  let main=null,sub=null;
  if(lms.length===1)main=lms[0];
  else if(lms.length>=2){const A=lms[0],B=lms[1],ax=lmNorm(A[9]).x,bx=lmNorm(B[9]).x;
    const right=ax>bx?A:B,left=ax>bx?B:A;main=domHand==='R'?right:left;sub=domHand==='R'?left:right}
  lastLm=main||null;aux.lm=sub||null;
  if(!main){handSeen=false;if(pinch){pinch=false;onRelease('pinch')}}
  else{handSeen=true;
    if(performance.now()-lastMouse>900){const p=handPt(main);cur.tx=p.x;cur.ty=p.y}
    const dp=pinchDist(main);if(!pinch&&dp<0.33){pinch=true;onPress('pinch')}else if(pinch&&dp>0.5){pinch=false;onRelease('pinch')}}
  if(!sub){aux.seen=false;if(aux.pinch){aux.pinch=false}}
  else{aux.seen=true;const p=handPt(sub);aux.tx=p.x;aux.ty=p.y;
    const dp=pinchDist(sub);if(!aux.pinch&&dp<0.33){aux.pinch=true;onPress('aux')}else if(aux.pinch&&dp>0.5){aux.pinch=false}}

    for(let i=0;i<=40;i++){const p=g.pt(i/40);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke();ctx.setLineDash([])}

  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=30;i++){const p=g.pt(st.arcP*i/30);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke();
  ctx.strokeStyle='#dfe6e8';ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<=12;i++){const p=g.pt(Math.max(0,st.arcP-0.35)+Math.min(st.arcP,0.35)*i/12+0.0001);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke();
  const tip=g.pt(st.arcP);
  if(!drag){zonesNow=[{key:'handle',x:tip.x,y:tip.y,r:30,act:()=>{drag={by:inputSrc,off:0};return{stay:1}}}];runZones(dt);handleRing({x:tip.x,y:tip.y,r:30},t);return}
  zonesNow=[];dwellP=0;
  if(!holding()){drag=null;return}
  if(!auxGate(s,440,160))return;
  const vx=cur.x-g.cx,vy=cur.y-g.cy,along=vx*g.ux+vy*g.uy,perp=vx*g.px+vy*g.py;
  let th=Math.atan2(perp,-along);if(th<0)th=th< -Math.PI/2?Math.PI:0;
  const tt=th/Math.PI,off=Math.abs(Math.hypot(vx,vy)-g.R);
  if(off>55){drag.off+=dt;
    if(drag.off>500){penalize(5,'바늘 경로 이탈','arcoff','바늘은 곡률을 따라 손목을 회전시켜 진행해야 합니다. 직선으로 밀거나 비틀면 판막이 찢어지고 바늘이 휩니다.');
      if(!EXAM()){ctx.font='700 20px '+FONT;ctx.fillStyle='#ffb547';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('바늘 곡률을 따라 손목을 돌리세요',440,140)}}
    return}
  drag.off=0;
  if(tt>=st.arcP-0.05&&tt<=st.arcP+0.15)st.arcP=Math.max(st.arcP,Math.min(1,tt));
  if(st.arcP>=0.97){st.arcP=1;st.passes.push({a:st.entry,b:st.exit});if(s.autoPull)st.pulled=1;toast('바늘 통과. 지침기로 바늘을 다시 잡아 곡률대로 빼냅니다.',1);next()}
}
function tailPt(){const a=st.tieA||st.entry;return{x:a.x-55,y:a.y+50}}
function updWrap(s,dt,t){
  const WRAP_C=st.wrapC,dx=cur.x-WRAP_C.x,dy=cur.y-WRAP_C.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
  if(d>40&&d<240){if(st.wPrev!==null){let da=a-st.wPrev;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;st.wAcc+=da}st.wPrev=a}else st.wPrev=null;
  const turns=Math.abs(st.wAcc)/(2*Math.PI);
  // 감긴 실 시각화
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=2;for(let i=0;i<Math.min(3,Math.floor(turns+0.15));i++){ctx.beginPath();ctx.ellipse(WRAP_C.x+40,WRAP_C.y-20+i*8,14,6,0,0,7);ctx.stroke()}
  if(!EXAM()){ctx.font='600 17px '+FONT;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText('감은 횟수 '+turns.toFixed(1)+'회  '+(st.wAcc>0.3?'↻':st.wAcc<-0.3?'↺':''),440,130);
    ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(WRAP_C.x,WRAP_C.y,120,0,7);ctx.stroke();ctx.setLineDash([])}
  const k=s.throwN,tp=tailPt();
  zonesNow=[C('tail',tp,24,()=>{
    const n=Math.round(turns),dir=Math.sign(st.wAcc)||1;let err=null;
    if(n===0)err=['실을 지침기에 감지 않았어요. 감은 뒤 꼬리를 잡습니다.','매듭: 감지 않고 묶음'];
    else if(k===1&&n<2)err=['첫 throw는 2회 감는 surgeon\'s knot이어야 조이는 동안 매듭이 풀리지 않습니다.','매듭: 첫 throw 1회 감기'];
    else if(k>1&&dir===st.lastDir)err=['직전 throw와 같은 방향으로 감으면 granny knot이 되어 미끄러집니다. 방향을 번갈아 감으세요.','매듭: 같은 방향으로 감기(granny knot)'];
    st.wAcc=0;if(err)return BAD(err[0],5,err[1],()=>{st.lastDir=dir});
    st.lastDir=dir;st.wAcc=0;return OK()})];
  runZones(dt);drawZoneMarks();
}
function finishTension(s){st.throws=s.throwN;st.tension=0;if(s.after)s.after();next()}
function updTension(s,dt,t){
  const tp=tailPt();
  if(!drag){zonesNow=[{key:'handle',x:tp.x,y:tp.y,r:28,act:()=>{drag={ox:cur.x,oy:cur.y,by:inputSrc,band:0};return{stay:1}}}];runZones(dt);handleRing({x:tp.x,y:tp.y,r:28},t);return}
  zonesNow=[];dwellP=0;
  if(!holding()){drag=null;st.tension=0;return}
  if(!auxGate(s,440,200)){drag.ox=cur.x-st.tension*s.dir;return}
  const raw=(cur.x-drag.ox)*s.dir;st.tension=raw;
  const bx=290,by=140,bw=300;ctx.fillStyle='rgba(255,255,255,0.15)';rr(bx,by,bw,14,7);ctx.fill();
  ctx.fillStyle='rgba(143,211,255,0.45)';ctx.fillRect(bx+bw*70/150,by,bw*45/150,14);
  ctx.fillStyle=raw>120?'#ff6b6b':'#fff';ctx.fillRect(bx+bw*Math.max(0,Math.min(150,raw))/150-2,by-4,4,22);
  ctx.font='500 14px '+FONT;ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('장력',bx-44,by+7);
  if(raw>130){penalize(5,'매듭 과도한 장력','tight','조직이 하얗게 질릴 정도로 조이면 혈류가 막혀 판막 괴사와 봉합사 탈락이 생깁니다. 판막이 맞닿을 정도로만.');
    if(!EXAM()){toast('너무 세게 조였어요. 조직이 하얗게 질립니다. 힘을 빼고 다시.',0,2600);drag=null;st.tension=0;return}
    finishTension(s);return}
  if(raw>=70&&raw<=115){drag.band+=dt;if(drag.band>600){
    toast(s.throwN===1?'Surgeon\'s knot 첫 throw가 조직을 맞붙였습니다.':'매듭 완성.',1);finishTension(s)}}

}

  document.getElementById('outBtn').onclick=()=>{user=null;try{localStorage.removeItem('dds_user')}catch(e){}renderHome()};
}
function pageHead(title){return brandBlock(true)+'<div class="page-head"><h2>'+title+'</h2><button class="btn-soft" id="ovBack">'+(ovFrom==='game'?'← 이전으로':'← 홈으로')+'</button></div>'}
function ovBack(){if(ovFrom==='game'){showScreen('game')}else showScreen('home')}
function normRec(r){return{time:r.time,case:r.case,mode:r.mode,score:Number(r.score)||0,durationSec:Number(r.durationSec)||0,
  mistakes:Array.isArray(r.mistakes)?r.mistakes:String(r.mistakes||'').split(' | ').filter(Boolean),name:r.name,code:r.code}}
async function renderRecords(){
  ov.innerHTML=pageHead('📒 내 기록')+'<div class="intro-note" id="recBody">불러오는 중…</div>'+themeBox();
  bindTheme();document.getElementById('ovBack').onclick=ovBack;
  let recs,src='';
  try{if(!API_ON||user.local)throw 0;recs=(await api({action:'history',code:user.code})).records}
  catch(e){recs=lsGet('dds_records',[]).filter(r=>r.code===user.code).reverse();src=API_ON&&!user.local?'<p class="hint">서버에 연결하지 못해 이 기기 기록만 보여요.</p>':''}
  recs=recs.map(normRec);
  const body=document.getElementById('recBody');if(!body)return;
  if(!recs.length){body.innerHTML=src+'<p class="msg">아직 기록이 없어요. 한 번 완주하면 여기에 차곡차곡 쌓여요 ✨</p>';return}
  const best={};recs.forEach(r=>{const k=r.case+'|'+r.mode;if(best[k]==null||r.score>best[k])best[k]=r.score});
  const tried=new Set(recs.map(r=>r.case)).size,avg=Math.round(recs.reduce((a,r)=>a+r.score,0)/recs.length);
  body.innerHTML=src+`<div class="stats"><div><b>${recs.length}</b><span>총 도전</span></div><div><b>${tried}/${CASE_KEYS.length}</b><span>해본 케이스</span></div><div><b>${avg}</b><span>평균 점수</span></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>날짜</th><th>케이스</th><th>모드</th><th>점수</th><th>시간</th><th>실수</th></tr></thead><tbody>`+
    recs.map((r,i)=>'<tr class="rrow" data-i="'+i+'"><td>'+fmtDate(r.time)+'</td><td>'+esc((CASES[r.case]||{}).name||r.case)+'</td><td><span class="pill '+r.mode+'">'+(MODE_NAME[r.mode]||r.mode)+'</span></td><td><b>'+r.score+'</b>'+(best[r.case+'|'+r.mode]===r.score?' <span class="star">★</span>':'')+'</td><td>'+fmtTime(r.durationSec)+'</td><td>'+r.mistakes.length+'건 ▾</td></tr>'+
      '<tr class="rdet" id="det'+i+'" hidden><td colspan="6">'+(r.mistakes.length?r.mistakes.map(m=>'· '+esc(m)).join('<br>'):'실수 없이 완주! 🎉')+'</td></tr>').join('')+'</tbody></table></div>';
  body.querySelectorAll('.rrow').forEach(tr=>tr.onclick=()=>{const d=document.getElementById('det'+tr.dataset.i);d.hidden=!d.hidden});
}
async function renderBoard(sel){
  const tabs=CASE_KEYS.map(k=>'<button class="sort-btn'+(k===sel.c?' active':'')+'" data-c="'+k+'">'+esc(CASES[k].name)+'</button>').join('');
  const mt=['exam','practice'].map(m=>'<button class="sort-btn'+(m===sel.m?' active':'')+'" data-m="'+m+'">'+MODE_NAME[m]+' 모드</button>').join('');
  ov.innerHTML=pageHead('🏆 리더보드')+'<div class="intro-note"><div class="sort-row">'+tabs+'</div><div class="sort-row">'+mt+'</div><div id="bBody">불러오는 중…</div></div>'+themeBox();
  bindTheme();document.getElementById('ovBack').onclick=ovBack;
  ov.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>renderBoard({c:b.dataset.c,m:sel.m}));
  ov.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>renderBoard({c:sel.c,m:b.dataset.m}));
  let list,note='';
  try{if(!API_ON)throw 0;list=(await api({action:'board',case:sel.c,mode:sel.m})).board}
  catch(e){note='<p class="hint">'+(API_ON?'서버에 연결하지 못해 ':'')+'이 기기에 저장된 기록만 보여요.</p>';
    const bestBy={};lsGet('dds_records',[]).map(normRec).filter(r=>r.case===sel.c&&r.mode===sel.m).forEach(r=>{const b=bestBy[r.code];
      if(!b||r.score>b.score||(r.score===b.score&&r.durationSec<b.durationSec))bestBy[r.code]=r});
    list=Object.values(bestBy).sort((a,b)=>b.score-a.score||a.durationSec-b.durationSec)}
  const body=document.getElementById('bBody');if(!body)return;
  if(!list.length){body.innerHTML=note+'<p class="msg">아직 아무도 도전하지 않았어요. 첫 번째 주인공이 되어볼까요? ✨</p>';return}
  const medal=i=>['🥇','🥈','🥉'][i]||(i+1);
  body.innerHTML=note+'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>순위</th><th>닉네임</th><th>최고 점수</th><th>시간</th><th>날짜</th></tr></thead><tbody>'+
    list.map((r,i)=>'<tr'+(user&&r.name===user.name?' class="me"':'')+'><td class="rank">'+medal(i)+'</td><td>'+esc(r.name)+'</td><td><b>'+r.score+'</b></td><td>'+fmtTime(r.durationSec)+'</td><td>'+fmtDate(r.time)+'</td></tr>').join('')+'</tbody></table></div>';
}
async function saveRecord(){
  const dur=Math.round((performance.now()-runStart)/1000);
  const uniq=[...new Set(mistakes.map(m=>m.why))];
  if(!user||user.guest){saved={status:'guest',dur};return}
  const rec={time:new Date().toISOString(),case:caseId,mode,score,durationSec:dur,mistakes:uniq,name:user.name,code:user.code};
  const all=lsGet('dds_records',[]);all.push(rec);lsSet('dds_records',all.slice(-300));
  if(!API_ON||user.local){saved={status:'local',dur};return}
  saved={status:'saving',dur};
  try{await api(null,Object.assign({action:'record'},rec));saved={status:'ok',dur}}catch(e){saved={status:'fail',dur}}
}
function endZones(){return[
  {key:'cases',label:'케이스 선택',rect:{x:340,y:640,w:160,h:50},act:()=>{resetAll();jumpTo('case');return{stay:1}}},
  {key:'again',label:'다시 하기',rect:{x:520,y:640,w:160,h:50},act:()=>{const m=mode,c=caseId;resetAll(c);mode=m;runStart=performance.now();next();return{stay:1}}},
  {key:'home',label:'홈으로',rect:{x:700,y:640,w:160,h:50},act:()=>{showScreen('home');return{stay:1}}}]}
function inRun(){const s=S[si];return screen==='game'&&s.grp!=='start'&&s.kind!=='end'}
document.getElementById('backBtn').onclick=()=>{
  if(screen!=='game'){if(screen!=='home')showScreen('home');return}
  const s=S[si];
  if(s.id==='title'||s.kind==='end'){showScreen('home');return}
  if(s.id==='case'){jumpTo('title');return}
  if(s.id==='mode'){resetAll();jumpTo('case');return}
  if(confirm('진행 중인 기록이 사라집니다. 모드 선택으로 돌아갈까요?')){resetAll(caseId)}};
document.getElementById('homeBtn').onclick=()=>{if(inRun()&&!confirm('진행 중인 기록이 사라집니다. 처음 화면으로 갈까요?'))return;showScreen('home')};
document.querySelectorAll('#gamePage .themeBtn').forEach(b=>{b.textContent=themeLabel();b.onclick=toggleTheme});
function syncPipBtn(){const b=document.getElementById('pipMinBtn');if(b)b.textContent=pipIsMin()?'내 화면 펼치기':'내 화면 접기'}
(()=>{const hb=document.getElementById('handBtn');if(!hb)return;const lab=()=>hb.textContent='주로 쓰는 손: '+(domHand==='R'?'오른손':'왼손');lab();
  hb.onclick=()=>{domHand=domHand==='R'?'L':'R';try{localStorage.setItem('dds_hand',domHand)}catch(e){}lab()}})();
document.getElementById('pipMinBtn').onclick=()=>{if(pipOnStart())pipStartMin=!pipStartMin;else pipMin=!pipMin;syncPipBtn()};
(()=>{const fb=document.getElementById('fsBtn'),fx=document.getElementById('fsExit'),fc=document.getElementById('fsCam'),box=document.querySelector('.stagebox');
  if(!fb||!box)return;
  const nat=()=>(box.requestFullscreen||box.webkitRequestFullscreen)&&(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  const isNat=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const exit=()=>{if(isNat()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}box.classList.remove('pseudo-fs');document.body.classList.remove('noscroll')};
  fb.onclick=()=>{if(isNat()||box.classList.contains('pseudo-fs')){exit();return}
    if(nat()){Promise.resolve((box.requestFullscreen||box.webkitRequestFullscreen).call(box)).then(()=>{try{const o=window.screen&&window.screen.orientation;if(o&&o.lock)o.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{box.classList.add('pseudo-fs');document.body.classList.add('noscroll')})}
    else{box.classList.add('pseudo-fs');document.body.classList.add('noscroll');window.scrollTo(0,0)}};
  if(fx)fx.onclick=exit;
  if(fc)fc.onclick=()=>document.getElementById('camBtn').click();})();

/* ================= main loop ================= */
let last=performance.now();
function loop(t){
  const dt=Math.min(50,t-last);last=t;
  if(camOn&&video.readyState>=2){if(handMode&&landmarker)trackHands();else trackMotion()}
  aux.x+=(aux.tx-aux.x)*0.5;aux.y+=(aux.ty-aux.y)*0.5;const px=cur.x,py=cur.y,k=handMode&&camOn?0.5:0.35;cur.x+=(cur.tx-cur.x)*k;cur.y+=(cur.ty-cur.y)*k;cur.vx=cur.x-px;cur.vy=cur.y-py;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1620';ctx.fillRect(0,0,W,H);
  if(screen!=='game'){zonesNow=[];requestAnimationFrame(loop);return}
  if(pipDrag){const mn=pipIsMin(),p=pipActivePos();p.x=cur.x-pipDrag.dx;p.y=cur.y-pipDrag.dy-(mn&&!pipOnStart()?108:0)}
  const s=S[si],view=typeof s.view==='function'?s.view():s.view;
  if(s.kind==='zones'){zonesNow=stepZones(s)}else if(s.kind==='end'){zonesNow=endZones()}else if(!['drag','depth','arc','wrap','tension','hold','circle','strokes','gauge','chair'].includes(s.kind)){zonesNow=[]}
  if(s.kind==='shake'){updShake(dt,t);if(S[si]===s)drawShake()}
  else if(view==='case')drawCaseView();
  else if(view==='mode')drawModeView();
  else if(view==='socket')drawSocket();
  else if(view==='needle')drawNeedleView();
  else if(view==='lac')drawLac();
  else if(view==='ept')drawEptView();
  else if(view==='dam')drawDamView();
  else if(view==='sheet')drawSheetView();
  else if(view==='seal')drawSealView();
  else if(view==='dam14')drawDam14View();
  else if(view==='sheet14')drawSheet14View();
  else if(view==='fluor')drawFluorView();
  else if(view==='trayfill')drawTrayFill();
  else if(view==='perio')drawPerioView();
  else if(view==='pz')drawPz();
  else if(view==='clamps')drawClampBoard();
  else if(view==='instr')drawInstrBoard();
  else if(view==='title')drawTitleView();
  else if(view==='xcp')drawXcp();
  else if(view==='probeR')drawProbeR();
  else if(view==='mob')drawMob();
  else if(view==='tmj')drawTmj();
  else if(view==='ortho')drawOrtho();
  else if(view==='letter')drawLetter();
  else if(view==='moyers')drawMoyers();
  else if(view==='head')drawHeadV();
  else if(view==='room')drawRoom();
  else if(view==='glove')drawGloveView();
  else if(view==='bench')drawBench(false);
  else if(view==='mouth')drawMouth();
  else if(view==='tooth')drawTooth(0,0,0,false,st.seated);
  else if(view==='end')drawEnd();
  if(S[si]===s){
    if(s.kind==='zones'||s.kind==='end'){if(s.tick)s.tick(dt);runZones(dt);if(S[si]===s){drawZoneMarks();tickHold()}}
    else if(s.kind==='drag')updDrag(s,dt,t);
    else if(s.kind==='depth')updDepth(s,dt,t);
    else if(s.kind==='arc')updArc(s,dt,t);
    else if(s.kind==='wrap')updWrap(s,dt,t);
    else if(s.kind==='tension')updTension(s,dt,t);
    else if(s.kind==='hold')updHold(s,dt,t);
    else if(s.kind==='circle')updCircle(s,dt,t);
    else if(s.kind==='strokes')updStrokes(s,dt,t);
    else if(s.kind==='gauge')updGauge(s,dt,t);
    else if(s.kind==='chair')updChair(s,dt,t);
    else if(s.kind==='wait'){const p=Math.min(1,(t-stepT0)/s.dur);
      rr(180,260,520,16,8);ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fill();rr(180,260,520*p,16,8);ctx.fillStyle='#8fd3ff';ctx.fill();
      ctx.font='500 18px '+FONT;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(s.waitMsg||'환자: "아랫입술이 두꺼워진 것 같아요… 혀도 저려요."',440,290);
      if(p>=1)next()}
    if(S[si]===s)checkContam(dt);
  }
  if(S[si].grp!=='start'){drawAuxTarget(S[si]);drawTray();drawHeader()}
  if(performance.now()<loadingUntil){const p=1-(loadingUntil-performance.now())/800;ctx.fillStyle='rgba(12,24,36,0.55)';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#8fd3ff';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.arc(W/2,H/2-20,34,-Math.PI/2,-Math.PI/2+Math.PI*2*p);ctx.stroke();
    ctx.font='600 20px '+FONT;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(loadingMsg,W/2,H/2+40)}
  drawPip();drawToast();drawCursor();
  requestAnimationFrame(loop);
}
resetAll();showScreen('home');requestAnimationFrame(loop);
})();

</script>
